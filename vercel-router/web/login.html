<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groq Router · 登入</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Crect x='3' y='3' width='58' height='58' rx='12' fill='none' stroke='%2322d3ee' stroke-width='3'/%3E%3Ctext x='32' y='46' font-size='34' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/web/theme.css">
</head>
<body>
<div class="center-wrap">
<div class="card">
  <h1><span class="logo">⚡</span><span><b>Groq Router</b> 中轉站</span></h1>
  <div class="sub">註冊帳號 → 管理員充值 → 用 API key 聊天（OpenAI 相容）</div>
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="switchTab('login')">登入</button>
    <button id="tabReg" onclick="switchTab('reg')">註冊</button>
  </div>
  <div id="paneLogin">
    <label>名稱</label><input type="text" id="loginName" autocomplete="username">
    <label>密碼</label><input type="password" id="loginPass" autocomplete="current-password">
    <button class="go" id="btnLogin" onclick="doLogin()">登入</button>
  </div>
  <div id="paneReg" style="display:none">
    <label>名稱（2~24 字）</label><input type="text" id="regName" autocomplete="username">
    <label>密碼（最少 6 字）</label><input type="password" id="regPass" autocomplete="new-password">
    <button class="go" id="btnReg" onclick="doReg()">註冊（初始 0 點）</button>
  </div>
  <div class="err" id="msg"></div>
  <div class="ok" id="okmsg"></div>
  <div class="hint">已有 session 會自動跳轉 · <a href="/admin">管理後台</a></div>
</div>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
// 推薦連結 ?ref=XXX → 註冊/登入後自動帶進兌換框
try{
  const rp = new URLSearchParams(location.search).get("ref");
  if(rp) localStorage.setItem("gr_ref", rp);
}catch{}
function switchTab(t){
  $("tabLogin").classList.toggle("active", t==="login");
  $("tabReg").classList.toggle("active", t==="reg");
  $("paneLogin").style.display = t==="login" ? "" : "none";
  $("paneReg").style.display = t==="reg" ? "" : "none";
  $("msg").textContent = ""; $("okmsg").textContent = "";
}
async function api(body){
  const r = await fetch("/api/auth", { method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body) });
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j.error&&j.error.message)||("HTTP "+r.status));
  return j;
}
async function doLogin(){
  const name=$("loginName").value.trim(), password=$("loginPass").value;
  if(!name||!password) return $("msg").textContent="請填名稱與密碼";
  $("btnLogin").disabled = true;
  try{
    const j = await api({action:"login", name, password});
    localStorage.setItem("gr_session", j.session);
    $("okmsg").textContent = "登入成功，跳轉中…";
    setTimeout(()=>location.href = "/me", 600);   // 統一控制台（admin 進去多幾頁）
  }catch(e){ $("msg").textContent = e.message; $("btnLogin").disabled = false; }
}
async function doReg(){
  const name=$("regName").value.trim(), password=$("regPass").value;
  if(!name||!password) return $("msg").textContent="請填名稱與密碼";
  $("btnReg").disabled = true;
  try{
    const j = await api({action:"register", name, password});
    localStorage.setItem("gr_session", j.session);
    $("okmsg").innerHTML = "註冊成功！API token（只顯示這一次，請複製）：<br><code style=\"user-select:all\">"
      + String(j.token||"").replace(/</g,"&lt;") + "</code><br>初始 0 點，請聯繫管理員充值。3 秒後進個人頁…";
    setTimeout(()=>location.href="/me", 3000);
  }catch(e){ $("msg").textContent = e.message; }
  $("btnReg").disabled = false;
}
// 已登入直接跳轉
(function(){
  if(!localStorage.getItem("gr_session")) return;
  fetch("/api/auth?action=me", { headers:{Authorization:"Bearer "+localStorage.getItem("gr_session")} })
    .then(r=>r.json()).then(j=>{
      if(j.ok) location.href = "/me";
    }).catch(()=>{});
})();
for (const [id, fn] of [["loginPass",doLogin],["regPass",doReg],["loginName",doLogin],["regName",doReg]]) {
  $(id).addEventListener("keydown", e=>{ if(e.key==="Enter") fn(); });
}
</script>
</body>
</html>
