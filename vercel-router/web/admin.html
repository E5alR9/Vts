<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Groq Router · 管理後台</title>
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2330;--line:#2b3444;--txt:#e6edf3;
--dim:#8b98a9;--acc:#4dd0e1;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 "Segoe UI","Microsoft JhengHei",system-ui,sans-serif}
header{position:sticky;top:0;z-index:50;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
padding:10px 18px;background:rgba(13,17,23,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0} header h1 b{color:var(--acc)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);
border-radius:999px;background:var(--panel);font-size:11.5px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bad)} .dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
main{padding:18px;display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr));max-width:1400px;margin:0 auto;align-items:start}
section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
#secLogin{grid-column:span 12} #secStatus{grid-column:span 4} #secKeys{grid-column:span 8}
#secUsers{grid-column:span 12}
@media(max-width:1100px){main>section{grid-column:span 12}}
h2{margin:0 0 10px;font-size:13.5px;color:var(--acc);padding-bottom:8px;border-bottom:1px solid var(--line)}
h2 small{color:var(--dim);font-weight:400;font-size:11px}
button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
button:hover{border-color:var(--acc);color:var(--acc)}
button.primary{background:#12333a;border-color:#1f6f7a;color:var(--acc)}
button.danger{border-color:#6e2b2b;color:#ff9d97}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select{width:100%;background:#0b0f14;color:var(--txt);
border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit}
label{display:block;font-size:12px;color:var(--dim);margin:8px 0 4px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #1e2632;vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:11.5px}
td.code{font-family:Consolas,monospace;word-break:break-all}
.rowbtns{display:flex;gap:6px;flex-wrap:wrap}
.rowbtns button{padding:3px 9px;font-size:12px}
.chip{font-size:11px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--dim);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#1f6f3f}.chip.bad{color:var(--bad);border-color:#6e2b2b}
.chip.warn{color:var(--warn);border-color:#6e5a1f}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.muted{color:var(--dim);font-size:12px}
#toast{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:99}
#toast div{background:#12333a;border:1px solid #1f6f7a;color:var(--acc);padding:9px 14px;border-radius:10px;font-size:13px}
#toast div.err{background:#2a1518;border-color:#6e2b2b;color:#ff9d97}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv div:nth-child(odd){color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1><b>Groq Router</b> 管理後台</h1>
  <span class="pill"><span id="kvdot" class="dot"></span><span id="kvtext">未連線</span></span>
  <span class="pill" id="stKeys">keys: --</span>
  <span class="pill" id="stUsers">users: --</span>
  <span style="flex:1"></span>
  <button onclick="loadAll()">↻ 重新整理</button>
</header>
<main>
  <section id="secLogin">
    <h2>🔑 管理員登入 <small>ADMIN_TOKEN（只存瀏覽器 localStorage，不上傳別處）</small></h2>
    <div style="display:flex;gap:8px">
      <input type="text" id="adminToken" placeholder="貼上 ADMIN_TOKEN…" autocomplete="off">
      <button class="primary" style="flex:none" onclick="saveToken()">連線</button>
      <button style="flex:none" onclick="clearToken()">登出</button>
    </div>
  </section>

  <section id="secStatus">
    <h2>📊 總覽</h2>
    <div class="kv" id="kvStatus"><div>狀態</div><div>尚未連線</div></div>
  </section>

  <section id="secKeys">
    <h2>🔑 Groq 金鑰 <small>env 基底唯讀；KV 管理的可增減/停用</small></h2>
    <div class="grid2">
      <div><label>新增金鑰（gsk_ 開頭）</label>
        <input type="text" id="newKey" placeholder="gsk_…" autocomplete="off"></div>
      <div><label>標籤（選填）</label>
        <input type="text" id="newKeyLabel" placeholder="例如：備用-01"></div>
    </div>
    <div style="margin-top:8px"><button class="primary" onclick="addKey()">＋ 新增</button></div>
    <table><thead><tr><th>前綴</th><th>來源</th><th>標籤</th><th>狀態</th><th>操作</th></tr></thead>
    <tbody id="keyRows"><tr><td colspan="5" class="muted">尚未載入</td></tr></tbody></table>
  </section>

  <section id="secUsers">
    <h2>👥 帳號與點數 <small>token 建好只顯示一次；點數 -1 = 無限</small></h2>
    <div class="grid2">
      <div><label>名稱</label><input type="text" id="newUserName" placeholder="例如：小夏子"></div>
      <div><label>角色</label><select id="newUserRole"><option value="user">user（受點數限制）</option><option value="admin">admin（全權限）</option></select></div>
      <div><label>初始點數（tokens）</label><input type="number" id="newUserCredits" value="10000" min="-1"></div>
      <div style="display:flex;align-items:flex-end"><button class="primary" onclick="addUser()">＋ 建帳號</button></div>
    </div>
    <table><thead><tr><th>名稱</th><th>角色</th><th>點數</th><th>token</th><th>操作</th></tr></thead>
    <tbody id="userRows"><tr><td colspan="5" class="muted">尚未載入</td></tr></tbody></table>
  </section>
</main>
<div id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
function toast(msg, err){ const d=document.createElement("div"); d.textContent=msg; if(err)d.className="err";
  $("toast").appendChild(d); setTimeout(()=>d.remove(), err?5200:2600); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function token(){ return localStorage.getItem("gr_admin_token") || ""; }
function saveToken(){ const v=$("adminToken").value.trim(); if(!v) return toast("請貼上 ADMIN_TOKEN",true);
  localStorage.setItem("gr_admin_token", v); toast("已保存，連線中…"); loadAll(); }
function clearToken(){ localStorage.removeItem("gr_admin_token"); $("adminToken").value=""; toast("已登出"); }
async function api(action, body, method){
  const opt = { method: method||(body?"POST":"GET"),
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+token() } };
  let url = "/api/admin?action="+encodeURIComponent(action);
  if(opt.method==="POST") opt.body = JSON.stringify({action, ...(body||{})});
  const r = await fetch(url, opt);
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j&&(j.error&&j.error.message))||("HTTP "+r.status));
  return j;
}
async function loadAll(){
  if(!token()){ toast("請先登入（貼 ADMIN_TOKEN）", true); return; }
  try{
    const [st, keys, users] = await Promise.all([
      api("status"), api("keys"), api("users"),
    ]);
    $("kvdot").className="dot on"; $("kvtext").textContent = st.kv ? "KV 已連線" : "無 KV（唯讀）";
    $("stKeys").textContent = `keys: env ${st.envKeys} + 管理 ${st.managedKeys}`;
    $("stUsers").textContent = `users: ${st.users} · 點數總量 ${st.creditsTotal}`;
    $("kvStatus").innerHTML = [
      ["KV", st.kv ? "✅ 已連線" : "❌ 未開通（keys 只能讀 env）"],
      ["env keys", st.envKeys], ["管理的 keys", st.managedKeys],
      ["帳號數", st.users], ["點數總量", st.creditsTotal],
      ["ADMIN_TOKEN", st.hasAdminToken ? "已設" : "未設"],
    ].map(([k,v])=>`<div>${esc(k)}</div><div>${esc(v)}</div>`).join("");
    renderKeys(keys); renderUsers(users.users||[]);
  }catch(e){ $("kvdot").className="dot"; $("kvtext").textContent="連線失敗";
    toast("載入失敗："+e.message, true); }
}
function renderKeys(j){
  const rows = [];
  (j.env||[]).forEach(k=>rows.push(`<tr><td class="code">${esc(k.prefix)}</td>
    <td><span class="chip">env</span></td><td>${esc(k.label||"")}</td>
    <td><span class="chip ok">啟用</span></td><td class="muted">env 唯讀</td></tr>`));
  (j.managed||[]).forEach(k=>rows.push(`<tr><td class="code">${esc(k.prefix)}</td>
    <td><span class="chip">管理</span></td><td>${esc(k.label||"")}</td>
    <td>${k.disabled?'<span class="chip bad">停用</span>':'<span class="chip ok">啟用</span>'}</td>
    <td><div class="rowbtns">
      <button onclick="toggleKey('${esc(k.id)}',${k.disabled?"false":"true"})">${k.disabled?"啟用":"停用"}</button>
      <button class="danger" onclick="removeKey('${esc(k.id)}')">刪除</button>
    </div></td></tr>`));
  $("keyRows").innerHTML = rows.join("") || '<tr><td colspan="5" class="muted">無</td></tr>';
}
async function addKey(){
  const key=$("newKey").value.trim(); if(!key) return toast("請貼上金鑰",true);
  try{ await api("keys.add", {key, label:$("newKeyLabel").value.trim()});
    $("newKey").value=""; $("newKeyLabel").value=""; toast("已新增"); loadAll();
  }catch(e){ toast("新增失敗："+e.message, true); }
}
async function toggleKey(id, disabled){
  try{ await api("keys.toggle",{id, disabled}); toast(disabled?"已停用":"已啟用"); loadAll(); }
  catch(e){ toast("失敗："+e.message, true); }
}
async function removeKey(id){
  if(!confirm("確定刪除這把 key？")) return;
  try{ await api("keys.remove",{id}); toast("已刪除"); loadAll(); }
  catch(e){ toast("失敗："+e.message, true); }
}
function renderUsers(list){
  $("userRows").innerHTML = list.map(u=>`<tr>
    <td>${esc(u.name)}${u.disabled?' <span class="chip bad">停用</span>':""}</td>
    <td><span class="chip ${u.role==="admin"?"warn":""}">${esc(u.role)}</span></td>
    <td>${u.credits===-1?'<span class="chip ok">無限</span>':esc(u.credits)}</td>
    <td class="code">${esc(u.token)}</td>
    <td><div class="rowbtns">
      <button onclick="addCredits('${esc(u.token)}')">＋充值</button>
      <button onclick="toggleUser('${esc(u.token)}',${u.disabled?"false":"true"})">${u.disabled?"啟用":"停用"}</button>
    </div></td></tr>`).join("") || '<tr><td colspan="5" class="muted">尚無帳號</td></tr>';
}
async function addUser(){
  const name=$("newUserName").value.trim(); if(!name) return toast("請填名稱",true);
  try{
    const j = await api("users.create",{name, role:$("newUserRole").value, credits:Number($("newUserCredits").value)});
    $("newUserName").value="";
    prompt("✅ 帳號已建（token 只顯示這一次，複製給用戶）：", j.token);
    loadAll();
  }catch(e){ toast("建帳號失敗："+e.message, true); }
}
async function addCredits(tok){
  const v = prompt("充值點數（可負數扣減）：", "10000");
  if(v===null) return;
  try{ const j = await api("users.add-credits",{token:tok, delta:Number(v)});
    toast("目前點數："+j.credits); loadAll();
  }catch(e){ toast("失敗："+e.message, true); }
}
async function toggleUser(tok, disabled){
  try{ await api("users.set",{token:tok, fields:{disabled}}); toast(disabled?"已停用":"已啟用"); loadAll(); }
  catch(e){ toast("失敗："+e.message, true); }
}
(function boot(){
  const t = token(); if(t) $("adminToken").value = t;
  if(t) loadAll();
})();
</script>
</body>
</html>
